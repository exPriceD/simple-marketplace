openapi: 3.0.3
info:
  title: Simple Marketplace API
  version: "1.0.0"
  description: |
    REST API: регистрация, авторизация, объявления, лента.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      description: Проверка доступности сервера.
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/register:
    post:
      summary: Регистрация пользователя
      description: Регистрирует нового пользователя по логину и паролю.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valid:
                value: { login: "user1", password: "password123" }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              examples:
                success:
                  value:
                    user:
                      id: "abc123"
                      login: "user1"
                      created_at: "2024-07-21T12:00:00Z"
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Авторизация пользователя
      description: Возвращает access_token по логину и паролю.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                value: { login: "user1", password: "password123" }
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    access_token: "jwt.token.here"
                    user:
                      id: "abc123"
                      login: "user1"
                      created_at: "2024-07-21T12:00:00Z"
        '401':
          $ref: '#/components/responses/AuthError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings:
    get:
      summary: Получить ленту объявлений
      description: Возвращает список объявлений с фильтрацией, сортировкой и пагинацией.
      operationId: listListings
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
          description: Количество объявлений на странице
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
          description: Смещение для пагинации
        - in: query
          name: sort_by
          schema: { type: string, enum: [created_at, price] }
          description: Поле сортировки
        - in: query
          name: sort_dir
          schema: { type: string, enum: [asc, desc] }
          description: Направление сортировки
        - in: query
          name: price_min
          schema: { type: integer, minimum: 0 }
          description: Минимальная цена
        - in: query
          name: price_max
          schema: { type: integer, minimum: 0 }
          description: Максимальная цена
      responses:
        '200':
          description: Лента объявлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingFeed'
              examples:
                success:
                  value:
                    items:
                      - id: 1
                        title: "Телефон"
                        description: "Почти новый"
                        image_url: "https://example.com/img.jpg"
                        price: 10000
                        author_id: "abc123"
                        author_login: "user1"
                        created_at: "2024-07-21T12:00:00Z"
                        is_owner: true
                    total: 1
                    next_offset: -1
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Создать объявление
      description: Размещает новое объявление (требуется авторизация).
      operationId: createListing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
            examples:
              valid:
                value:
                  title: "Телефон"
                  description: "Почти новый"
                  image_url: "https://example.com/img.jpg"
                  price: 10000
      responses:
        '201':
          description: Объявление создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/Listing'
              examples:
                success:
                  value:
                    listing:
                      id: 1
                      title: "Телефон"
                      description: "Почти новый"
                      image_url: "https://example.com/img.jpg"
                      price: 10000
                      author_id: "abc123"
                      author_login: "user1"
                      created_at: "2024-07-21T12:00:00Z"
                      is_owner: true
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT-токен авторизации. Передавать в заголовке:
        Authorization: Bearer <token>
  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                error:
                  code: invalid_title
                  message: validation error
                  request_id: abc123
    ConflictError:
      description: Конфликт (например, логин уже занят)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            loginTaken:
              value:
                error:
                  code: login_taken
                  message: conflict
                  request_id: abc123
    AuthError:
      description: Ошибка авторизации или неверные учётные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: unauthorized
                  request_id: abc123
    BadRequestError:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            bad:
              value:
                error:
                  code: bad_request
                  message: bad request
                  request_id: abc123
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: internal error
                  request_id: abc123
  schemas:
    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    CreateListingRequest:
      type: object
      required: [title, description, image_url, price]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        image_url: { type: string, format: uri }
        price: { type: integer, minimum: 0, maximum: 1000000000 }
    Listing:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        image_url: { type: string }
        price: { type: integer }
        author_id: { type: string }
        author_login: { type: string }
        created_at: { type: string, format: date-time }
        is_owner: { type: boolean }
    ListingFeed:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        total: { type: integer }
        next_offset: { type: integer }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
security:
  - {}

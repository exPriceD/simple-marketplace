version: "3.9"

services:
  db:
    image: postgres:17.5-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mp
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mp" ]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - mp_pg_data:/var/lib/postgresql/data

  db_test:
    image: postgres:17.5-alpine
    container_name: db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mp_test
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mp_test" ]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - mp_pg_test_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-marketplace:latest
    container_name: mp_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HTTP_ADDR: ":8080"
      PG_URL: "postgres://postgres:postgres@db:5432/mp?sslmode=disable"
      JWT_SECRET: "secret_key"
      JWT_TTL: "1h"
      ARGON_TIME: "1"
      ARGON_MEMORY_MB: "64"
      ARGON_THREADS: "2"
      ARGON_KEY_LEN: "32"
      LOG_LEVEL: "info"
      MIGRATE_ONLY: "0"
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Одноразовый сервис для миграции тестовой БД
  migrate_test_db:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-marketplace:latest
    container_name: mp_migrate_test
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      PG_URL: "postgres://postgres:postgres@db_test:5432/mp_test?sslmode=disable"
      MIGRATE_ONLY: "1"
      APP_HTTP_ADDR: ":8080"
      JWT_SECRET: "ignore"
      JWT_TTL: "1h"
      ARGON_TIME: "1"
      ARGON_MEMORY_MB: "64"
      ARGON_THREADS: "2"
      ARGON_KEY_LEN: "32"
      LOG_LEVEL: "info"

volumes:
  mp_pg_data:
  mp_pg_test_data:
